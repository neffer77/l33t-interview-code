name: Deploy Codeopolis to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build site
        run: ./scripts/build-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  r14-deployed-acceptance:
    name: R14 deployed mobile/desktop acceptance
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium acceptance runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Wait for deployed edge to serve this commit
        env:
          CODEOPOLIS_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          # Never run the acceptance against a stale CDN edge: poll build-info.json
          # until it reports this commit's build, then let the edge settle briefly.
          expected="$(git rev-parse --short HEAD)"
          echo "Expecting deployed build version: $expected"
          matched=0
          for i in $(seq 1 60); do
            got="$(curl -fsS "${CODEOPOLIS_URL%/}/build-info.json?ts=$(date +%s%N)" 2>/dev/null \
              | python3 -c 'import sys,json;print(json.load(sys.stdin).get("version",""))' 2>/dev/null || echo "")"
            echo "attempt $i: deployed build-info version='$got'"
            if [ "$got" = "$expected" ]; then matched=1; echo "Edge is fresh."; break; fi
            sleep 3
          done
          if [ "$matched" != "1" ]; then
            echo "::warning::Deployed edge never reported $expected after ~3m; running acceptance anyway."
          fi
          # Small settle so first-run camera framing/assets are fully warm.
          sleep 6
      - name: Exercise deployed five-viewport player flow
        env:
          CODEOPOLIS_URL: ${{ needs.deploy.outputs.page_url }}
        run: python scripts/r14-browser-acceptance.py --url "$CODEOPOLIS_URL" --out artifacts/r14-clean-deployed --deployed
      - name: Upload deployed R14 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r14-clean-deployed-player-evidence
          path: artifacts/r14-clean-deployed
          if-no-files-found: warn
