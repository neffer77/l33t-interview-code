name: Validate Codeopolis

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all JavaScript syntax
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Verify local page assets exist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          refs = re.findall(r'(?:src|href)="([^"]+)"', html)
          local = [r for r in refs if not r.startswith(('http://','https://','data:','#'))]
          missing = [r for r in local if not Path(r).exists()]
          if missing:
              raise SystemExit('Missing local assets: ' + ', '.join(missing))
          print('Validated local assets:', ', '.join(local))
          PY
      - name: Run beta readiness smoke suite
        run: node tests/beta-smoke.mjs
      - name: Run civilization foundation suite
        run: node tests/civilization-foundation.mjs
      - name: Run city services suite
        run: node tests/city-services.mjs
      - name: Run building specialization suite
        run: node tests/building-specializations.mjs
      - name: Run construction queue suite
        run: node tests/construction-queue.mjs
      - name: Run planning overlay suite
