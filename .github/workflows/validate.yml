name: Validate Codeopolis

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  syntax-and-assets:
    name: Syntax & local assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all JavaScript syntax
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Verify local page assets exist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          refs = re.findall(r'(?:src|href)="([^"]+)"', html)
          local = [r for r in refs if not r.startswith(('http://','https://','data:','#'))]
          missing = [r for r in local if not Path(r).exists()]
          if missing:
              raise SystemExit('Missing local assets: ' + ', '.join(missing))
          print('Validated local assets:', ', '.join(local))
          PY

  regression-tests:
    name: Regression test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Codeopolis regression suites
        run: node scripts/run-validation-tests.mjs
      - name: Run R9 deep economy regression
        run: node tests/r9-deep-economy-supply-chains.mjs

  r14-player-acceptance:
    name: R14 browser player acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium acceptance runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          # Install once for fixed viewports, live reframing, and tab ownership.
          python -m playwright install chromium
      - name: Build deployable site
        run: ./scripts/build-site.sh
      - name: Start local production server
        run: |
          python -m http.server 4173 --directory _site >/tmp/codeopolis-r14-server.log 2>&1 &
          echo $! >/tmp/codeopolis-r14-server.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/codeopolis-r14-server.log
          exit 1
      - name: Exercise five canonical player viewports
        run: python scripts/r14-browser-acceptance.py --url http://127.0.0.1:4173/ --out artifacts/r14-clean-local
      - name: Exercise same-session browser reframing
        if: always()
        run: python scripts/r14-live-reframe-acceptance.py --url http://127.0.0.1:4173/ --out artifacts/r14-live-reframe
      - name: Exercise all primary tab surfaces
        if: always()
        run: python scripts/r14-tab-surface-acceptance.py --url http://127.0.0.1:4173/ --out artifacts/r14-live-reframe/tab-ownership
      - name: Upload R14 local visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r14-clean-local-player-evidence
          path: artifacts/r14-clean-local
          if-no-files-found: warn
      - name: Upload live reframe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r14-live-reframe-evidence
          path: artifacts/r14-live-reframe
          if-no-files-found: warn
